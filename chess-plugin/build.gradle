import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    alias(libs.plugins.mockito)
}

evaluationDependsOn(':app')
evaluationDependsOn(':ui')

dependencies {
    compileOnly files(rootProject.project(':ui').configurations.compileClasspath)
    testImplementation files(rootProject.project(':ui').configurations.compileClasspath)
    testImplementation project(':ui')
    testImplementation libs.bundles.testfx
    compileOnly project(':plugin-api')
    compileOnly project(':app')
    compileOnly project(':ui')
    compileOnly libs.javafx.weaver
    compileOnly libs.atlantafx
    compileOnly platform(libs.ikonli.bom)
    compileOnly libs.ikonli.javafx
    compileOnly libs.ikonli.materialdesign2.pack
    compileOnly 'org.springframework.boot:spring-boot-starter-webclient'
    compileOnly project(':common')
    compileOnly(platform(SpringBootPlugin.BOM_COORDINATES))
    compileOnly 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.springframework.boot:spring-boot-starter-websocket'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly libs.commons.lang
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'jakarta.xml.bind:jakarta.xml.bind-api'

    testImplementation project(':plugin-api')
    testImplementation project(':app')
    testImplementation project(':common')
    testImplementation(platform(SpringBootPlugin.BOM_COORDINATES))
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation(testFixtures(project(':common')))
    testImplementation libs.junit
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Spring MVC resolves unnamed request/path parameters from this metadata.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

jar {
    archiveBaseName = 'xeres-chess'
    manifest {
        attributes 'Xeres-Plugin-Api': '2', 'Implementation-Version': project.version
    }
}

test {
    dependsOn jar
    systemProperty 'xeres.test.chessJar', tasks.jar.archiveFile.get().asFile.absolutePath
    useJUnitPlatform()
    jvmArgs '-ea', '-Djava.net.preferIPv4Stack=true', '-Dfile.encoding=UTF-8', '-Djava.awt.headless=true', '-Dtestfx.robot=glass', '-Dglass.platform=headless'
}

// Explicitly stage the optional plugin for local development or manual installation.
tasks.register('stagePlugin', Copy) {
    dependsOn jar
    from(tasks.jar) { rename { 'xeres-chess.jar' } }
    into rootProject.layout.buildDirectory.dir('plugins')
}
